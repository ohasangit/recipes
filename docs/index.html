<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boltito Dogito Cookbook 🐾</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { height: 100vh; display: flex; flex-direction: column; background: #f5f5f5; font-family: sans-serif; }
    header { padding: 12px 20px; background: #D9534F; color: white; font-size: 1.1rem; font-weight: bold; }
    embed { flex: 1; width: 100%; border: none; }
    .fallback { display: none; flex: 1; align-items: center; justify-content: center; flex-direction: column; gap: 12px; }
    embed:not([src]) ~ .fallback { display: flex; }
  </style>
</head>
<body>
  <header>Boltito Dogito Cookbook 🐾</header>
  <embed src="main.pdf" type="application/pdf">
  <div class="fallback">
    <p>Your browser cannot display the PDF inline.</p>
    <a href="main.pdf">Download the cookbook (PDF)</a>
  </div>
</body>
</html>
